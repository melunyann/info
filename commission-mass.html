<style>
:root{
--pink:#FF5C7A;--pink-deep:#E8425F;--blue:#A9DDEE;--blue-deep:#7FC7DE;
--bg:#FFF6F8;--white:#FFFFFF;--ink:#3F3A42;--muted:#8B8790;--border:#F5DCE1;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);background:var(--bg);user-select:none;-webkit-user-select:none}
.wrap{max-width:900px;margin:0 auto;padding:56px 44px 80px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--pink-deep);text-decoration:none;margin-bottom:26px}
.kicker{font-size:11px;letter-spacing:.18em;color:var(--pink-deep);margin-bottom:8px;font-weight:700}
h1{font-size:22px;font-weight:700;margin:0 0 26px}
.commission-note{font-size:12px;color:#245a6b;background:#EAF7FB;padding:18px 22px;border-radius:14px;line-height:2}
.numbered{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;font-weight:700;margin:30px 0 14px}
.hno{font-size:11px;color:#fff;background:var(--blue-deep);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.linkrow{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.linkbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue-deep);background:#fff;border:1.5px solid var(--blue-deep);border-radius:18px;padding:7px 16px;text-decoration:none}
.linkbtn svg{width:13px;height:13px}
.scrollwrap{position:relative}
.arrow{position:absolute;top:0;z-index:2;width:20px;height:26px;border:none;background:none;color:rgba(255,92,122,0.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.arrow.hidden{opacity:0;pointer-events:none}
.arrow:first-child{left:0}
.arrow:last-child{right:0}
.ychrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.ychrow::-webkit-scrollbar{height:4px}
.ychrow::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.ychcard{flex:0 0 150px}
.ychph{aspect-ratio:1;background:#FBEAEE;border-radius:12px;position:relative;overflow:hidden;margin-bottom:6px}
.ychph canvas{width:100%;height:100%;display:block;position:absolute;top:0;left:0}
.ychcap{font-size:11px;color:var(--muted);text-align:center;line-height:1.8}
@media (max-width:600px){.wrap{padding:44px 22px 60px}}
</style>
</head>

<script>
(function(){
function loadToCanvas(ph){
var src=ph.getAttribute('data-src');if(!src)return;
var canvas=ph.querySelector('canvas');if(!canvas)return;
var img=new Image();img.crossOrigin='anonymous';
img.onload=function(){
var dpr=window.devicePixelRatio||1,size=ph.offsetWidth||120;
canvas.width=size*dpr;canvas.height=size*dpr;
canvas.style.width=size+'px';canvas.style.height=size+'px';
var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
ctx.drawImage(img,0,0,size,size);
ctx.save();ctx.globalAlpha=0.1;ctx.fillStyle='#3F3A42';
ctx.font='bold '+Math.round(size*0.09)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.translate(size/2,size/2);ctx.rotate(-Math.PI/4);
var step=Math.round(size*0.45);
for(var y=-size;y<size*1.5;y+=step){ctx.fillText('@melunyann',0,y);}
ctx.restore();
alignArrows();updateAllArrowVisibility();
};
img.onerror=function(){ph.innerHTML='イラスト';};
img.src=src;
}
function alignArrows(){
document.querySelectorAll('.scrollwrap').forEach(function(w){
var ph=w.querySelector('.ychph');if(!ph)return;
var top=(ph.offsetHeight-26)/2;
w.querySelectorAll('.arrow').forEach(function(b){b.style.top=top+'px';});
});
}
function updateArrowVisibility(w){
var row=w.querySelector('.ychrow'),btns=w.querySelectorAll('.arrow');
if(!row||btns.length<2)return;
btns[0].classList.toggle('hidden',row.scrollLeft<=4);
btns[1].classList.toggle('hidden',row.scrollLeft+row.clientWidth>=row.scrollWidth-4);
}
function updateAllArrowVisibility(){document.querySelectorAll('.scrollwrap').forEach(updateArrowVisibility);}

document.querySelectorAll('.scrollwrap').forEach(function(w){
var btns=w.querySelectorAll('.arrow'),row=w.querySelector('.ychrow');
btns[0].addEventListener('click',function(){row.scrollBy({left:-Math.round(row.clientWidth*0.7),behavior:'smooth'});});
btns[1].addEventListener('click',function(){row.scrollBy({left:Math.round(row.clientWidth*0.7),behavior:'smooth'});});
row.addEventListener('scroll',function(){updateArrowVisibility(w);},{passive:true});
});

document.querySelectorAll('.ychph[data-src]').forEach(function(ph){
ph.addEventListener('contextmenu',function(e){e.preventDefault();});
ph.addEventListener('dragstart',function(e){e.preventDefault();});
});
var observer=new IntersectionObserver(function(entries){
entries.forEach(function(entry){if(entry.isIntersecting){loadToCanvas(entry.target);observer.unobserve(entry.target);}});
},{rootMargin:'80px'});
document.querySelectorAll('.ychph[data-src]').forEach(function(ph){observer.observe(ph);});

document.querySelectorAll('.ychph canvas').forEach(function(canvas){
canvas.addEventListener('touchstart',function(e){if(e.touches.length===1){canvas._tx=e.touches[0].clientX;canvas._ty=e.touches[0].clientY;}},{passive:true});
canvas.addEventListener('touchend',function(e){
var dx=Math.abs(e.changedTouches[0].clientX-(canvas._tx||0)),dy=Math.abs(e.changedTouches[0].clientY-(canvas._ty||0));
if(dx<5&&dy<5)e.preventDefault();
},{passive:false});
});

window.addEventListener('resize',function(){alignArrows();updateAllArrowVisibility();});
alignArrows();updateAllArrowVisibility();
})();
</script>
