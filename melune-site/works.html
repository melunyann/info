<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>実績一覧 - melune ／ めるね</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--pink:#FF5C7A;--pink-deep:#E8425F;--blue:#A9DDEE;--blue-deep:#7FC7DE;
--bg:#FFF6F8;--white:#FFFFFF;--ink:#3F3A42;--muted:#8B8790;--border:#F5DCE1;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);background:var(--bg);user-select:none;-webkit-user-select:none}
.wrap{max-width:900px;margin:0 auto;padding:56px 44px 80px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--pink-deep);text-decoration:none;margin-bottom:26px}
.kicker{font-size:11px;letter-spacing:.18em;color:var(--pink-deep);margin-bottom:8px;font-weight:700}
h1{font-size:22px;font-weight:700;margin:0 0 10px}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{aspect-ratio:1;background:#FBEAEE;border-radius:14px;position:relative;overflow:hidden}
.item canvas{width:100%;height:100%;display:block;position:absolute;top:0;left:0}
@media (max-width:600px){.wrap{padding:44px 22px 60px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html#profile">‹ プロフィールに戻る</a>
<div class="kicker">WORKS</div>
<h1>実績一覧</h1>
<p class="sub">これまでにお受けしたご依頼の一覧です。</p>
<div class="grid" id="grid">
<div class="item" data-src="https://lh3.googleusercontent.com/d/157C-EBf4E1a7xji9XrMPN0CDonpQdChz"><canvas></canvas></div>
<div class="item" data-src="https://lh3.googleusercontent.com/d/1R7GKmxDohSPFvk7AWQd1c9h7GE3komUf"><canvas></canvas></div>
<div class="item" data-src="https://lh3.googleusercontent.com/d/1XbOCkblyqkubRnBkKWzdwDKmiDTXA6DK"><canvas></canvas></div>
<div class="item" data-src="https://lh3.googleusercontent.com/d/1jc7Zk3Futrp9eg42QaFMAWYdaIDfnA3R"><canvas></canvas></div>
<div class="item" data-src="https://lh3.googleusercontent.com/d/1WnUDw3SI6fY0lPX4vCSs9Mltx-8N8RXz"><canvas></canvas></div>
<div class="item" data-src="https://lh3.googleusercontent.com/d/1EI3ynfz95RIBMXEweD41SP8HLuS81Vid"><canvas></canvas></div>
</div>
</div>
<script>
(function(){
function loadToCanvas(item){
var src=item.getAttribute('data-src');if(!src)return;
var canvas=item.querySelector('canvas');if(!canvas)return;
var image=new Image();image.crossOrigin='anonymous';
image.onload=function(){
var w=item.offsetWidth||140,h=item.offsetHeight||w;
var dpr=Math.max(Math.min(window.devicePixelRatio||1,3),2);
canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.imageSmoothingQuality='high';
var ir=image.naturalWidth/image.naturalHeight,cr=w/h,sx,sy,sw,sh;
if(ir>cr){sh=image.naturalHeight;sw=sh*cr;sx=(image.naturalWidth-sw)/2;sy=0;}
else{sw=image.naturalWidth;sh=sw/cr;sx=0;sy=(image.naturalHeight-sh)/2;}
ctx.drawImage(image,sx,sy,sw,sh,0,0,w,h);
ctx.save();ctx.globalAlpha=0.1;ctx.fillStyle='#3F3A42';
ctx.font='bold '+Math.round(w*0.12)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.translate(w/2,h/2);ctx.rotate(-Math.PI/4);
var step=Math.round(Math.max(w,h)*0.55);
for(var y=-Math.max(w,h);y<Math.max(w,h)*1.5;y+=step){ctx.fillText('@melune',0,y);}
ctx.restore();
};
image.onerror=function(){item.textContent='';};
image.src=src;
}
document.querySelectorAll('.item[data-src]').forEach(function(item){
item.addEventListener('contextmenu',function(e){e.preventDefault();});
item.addEventListener('dragstart',function(e){e.preventDefault();});
});
var observer=new IntersectionObserver(function(entries){
entries.forEach(function(entry){if(entry.isIntersecting){loadToCanvas(entry.target);observer.unobserve(entry.target);}});
},{rootMargin:'80px'});
document.querySelectorAll('.item[data-src]').forEach(function(item){observer.observe(item);});
document.querySelectorAll('.item canvas').forEach(function(c){
c.addEventListener('touchstart',function(e){if(e.touches.length===1){c._tx=e.touches[0].clientX;c._ty=e.touches[0].clientY;}},{passive:true});
c.addEventListener('touchend',function(e){
var dx=Math.abs(e.changedTouches[0].clientX-(c._tx||0)),dy=Math.abs(e.changedTouches[0].clientY-(c._ty||0));
if(dx<5&&dy<5)e.preventDefault();
},{passive:false});
});
})();
</script>
</body>
</html>
